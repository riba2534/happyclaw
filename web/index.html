<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%icons/icon-192.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f5" />

    <!-- PWA iOS Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HappyClaw" />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%icons/apple-touch-icon-180.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- iOS PWA 优化：保留自动识别控制（页面缩放已允许） -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />

    <!-- 预热认证：AuthGuard 放行前整棵已登录子树都不渲染，若等入口 JS 执行后
         才发 /api/auth/me，这个 RTT 会和分片下载串行。这里在 HTML 解析阶段就
         发出请求，stores/auth.ts 一次性消费 window.__authPrewarm。 -->
    <script>
      window.__authPrewarm = fetch('%BASE_URL%api/auth/me', {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      }).catch(function () {
        return null;
      });
    </script>

    <title>HappyClaw</title>
  </head>
  <body>
    <script>
      (function () {
        var d = document.documentElement,
          s = localStorage.getItem('happyclaw-theme');
        if (
          s === 'dark' ||
          (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        )
          d.classList.add('dark');
        // Mirrors readColorScheme() in src/hooks/useTheme.ts: a missing or
        // unknown key means the default orange scheme.
        var c = localStorage.getItem('happyclaw-color-scheme');
        if (c === 'neutral') d.classList.add('theme-neutral');
        else if (c !== 'default') d.classList.add('theme-orange');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m)
          m.setAttribute(
            'content',
            getComputedStyle(d).getPropertyValue('--background').trim() ||
              '#faf9f5',
          );
        if (localStorage.getItem('happyclaw-font-style') === 'anthropic')
          d.classList.add('font-anthropic');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
